name: Publish WITNESS Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: witness-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate distribution and website
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_manifest.py --check
          python scripts/verify_files.py
          python scripts/check_links.py
          python scripts/check_site.py
      - name: Check existing Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GH_REPO"]}/pages',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              enabled = data.get('build_type') == 'workflow'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          if not enabled:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Website validated, but NOT deployed. GitHub Pages must be enabled with Source = GitHub Actions. No settings or credentials were changed.\n')
          PY
      - name: Stage publishable files only
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/witness-pages"
          cp site/index.html site/en.html site/styles.css site/app.js "$RUNNER_TEMP/witness-pages/"
          cp -R site/assets "$RUNNER_TEMP/witness-pages/assets"
      - name: Upload validated static site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/witness-pages
          retention-days: 1
  deploy:
    if: needs.validate.outputs.enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
